name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leafscan_flask_app/requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest tests/ -v

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build web app image
        run: docker build -t leafscan-web:${{ github.sha }} ./leafscan_flask_app

      - name: Build API image
        run: docker build -t leafscan-api:${{ github.sha }} ./leafscan_api_app

      - name: Confirm docker-compose config is valid
        run: docker compose -f docker-compose.yml config
